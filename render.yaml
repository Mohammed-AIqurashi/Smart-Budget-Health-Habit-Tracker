services:
  # Backend Web Service
  - type: web
    name: smart-budget-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npx prisma db push && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-budget-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  # Frontend Static Site
  - type: web
    name: smart-budget-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Free PostgreSQL Database
  - name: smart-budget-db
    region: singapore
    plan: free
    databaseName: smart_budget
